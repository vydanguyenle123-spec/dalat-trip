        @keyframes shimmer {
          0% { transform: translateX(-120%) skewX(-20deg); }
          100% { transform: translateX(500%) skewX(-20deg); }
        }
        @keyframes float-badge {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-5px); }
        }

          50% { box-shadow: 0 0 0 8px rgba(36,136,50,0.12); }
        }
        @keyframes badge-pop {
          0% { transform: scale(0.8) rotate(-5deg); opacity:0; }
          60% { transform: scale(1.08) rotate(2deg); opacity:1; }
          100% { transform: scale(1) rotate(0deg); opacity:1; }
        }
        @keyframes ray-rotate {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes float-mist {
          0% { transform: translateY(4px) scale(0.8); opacity: 0; }

          75% { opacity: 0.25; }
          100% { transform: translateY(-22px) scale(1.15); opacity: 0; }
        }
        @keyframes sun-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        /* iOS Liquid Glass — squish/jelly on tap */
        @keyframes ios-squish {
          0%   { transform: scale(1) skewX(0deg); }
          12%  { transform: scale(0.962, 0.974) skewX(-0.6deg); }
          38%  { transform: scale(1.030, 1.016) skewX(0.4deg); }
          60%  { transform: scale(0.992, 0.997); }
          78%  { transform: scale(1.006, 1.002); }
          100% { transform: scale(1); }
        }
        @keyframes ios-panel-squish {
          0%   { transform: scaleX(1) scaleY(1); }

          60%  { transform: scaleX(1.016) scaleY(0.992); }
          78%  { transform: scaleX(0.996) scaleY(1.004); }
          100% { transform: scaleX(1) scaleY(1); }
        }
        @keyframes ios-shine {
          0%   { opacity: 0; left: -80%; }
          18%  { opacity: 1; }
          70%  { opacity: 0.25; }

        }
        @keyframes ios-ripple {

        .day-card {

          cursor: pointer;

        .day-card:hover { box-shadow: 0 8px 28px rgba(0,0,0,0.13); }
        .day-card-header {
          position: relative;
          overflow: hidden;
          transition: background 0.2s ease;
        }
        .info-row {
          transition: background 0.2s ease, transform 0.15s ease;
        }
        .info-row:hover { background: rgba(36,136,50,0.05); transform: translateX(2px); }
        .info-icon {
          transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
        }
        .info-row:hover .info-icon { transform: scale(1.3) rotate(-8deg); }
        /* Weather rotating ray frame */
        .weather-frame {
          position: relative;
          border-radius: 13px;
          padding: 2px;
          overflow: hidden;
        }
        .weather-ray {
          position: absolute;
          inset: -120%;
          background: conic-gradient(
            from 0deg,
            transparent 0deg,
            #93c5fd 35deg,
            #60a5fa 65deg,
            #38bdf8 85deg,
            #bae6fd 105deg,
            transparent 140deg,
            transparent 215deg,
            #bfdbfe 255deg,
            #7dd3fc 285deg,
            #93c5fd 310deg,
            transparent 345deg
          );
          animation: ray-rotate 5s linear infinite;
          pointer-events: none;
        }
        .weather-inner {
          position: relative;
          z-index: 1;
          border-radius: 11px;
          background: rgba(255,255,255,0.4);
          backdrop-filter: blur(16px) saturate(160%);
          -webkit-backdrop-filter: blur(16px) saturate(160%);
          border: 1px solid rgba(255,255,255,0.65);
        }
        .weather-particle {
          position: absolute;
          bottom: 0;
          font-size: 10px;
          opacity: 0;
          animation: float-mist 3.5s ease-out infinite;
          animation-delay: var(--wp-delay, 0s);
          left: var(--wp-x, 50%);
          pointer-events: none;
        }
        .hero-badge { animation: badge-pop 0.6s cubic-bezier(.34,1.56,.64,1) 0.3s both; }
        .section-card { transition: box-shadow 0.2s ease; }
        .section-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
